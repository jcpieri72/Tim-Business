/* ===== CSV ===== */
function csv(t){const l0=t.split('\n')[0],sep=[';','\t',','].map(s=>[s,l0.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];const r=[];let w=[],c='',q=0;
 for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==sep){w.push(c);c=''}else if(h=='\n'){w.push(c);r.push(w);w=[];c=''}else if(h!='\r')c+=h}
 if(c||w.length){w.push(c);r.push(w)}return r.filter(x=>x.some(y=>y.trim()))}
const dt=s=>{s=(s||'').trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;m=s.match(/^(\d{4})-(\d\d)-(\d\d)/);if(m)return m[0];m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d\d)\b/);if(m)return`20${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return''};
const num=s=>{s=(s||'').replace(/[€\s]/g,'');if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0};
/* campi da leggere in ogni file: [etichetta, obbligatorio, regex per riconoscere la colonna] */
const FLD={k:['Codice pratica / ordine',1,[/^cod.*ordine/i,/codordine/i,/pratica/i,/id.?ordine/i,/codice.?contratto/i,/num.*ordine/i,/^ordine/i,/contratto/i,/^id$/i]],
 d:['Data inserimento',1,[/data.?creazione/i,/data.?inser/i,/data.?ordine/i,/data.?vendita/i,/data.?richiesta/i,/^data$/i,/data/i]],
 s:['Codice negozio (PDV)',1,[/codicepdv/i,/cod.*pdv/i,/codice.?negozio/i,/codice.?punto/i,/^pdv$/i,/pdv/i,/negozio/i]],
 n:['Nome negozio',0,[/^ragione.?sociale$/i,/nome.?pdv/i,/denominazione.?pdv/i,/insegna/i,/nome.?negozio/i,/ragione.?sociale(?!.*cli)/i]],
 c:['Comune negozio',0,[/pdv.?comune/i,/comune.?pdv/i,/comune(?!.*cli)/i]],

 st:['Stato pratica',1,[/stato.?aggregato/i,/stato.?incentiv/i,/stato.?ordine/i,/stato.?pratica/i,/stato.?contratto/i,/^stato$/i,/stato/i,/esito/i]],
 t:['Tipo (NIP/ULL · tipo linea · modello)',0,[/tipo.?origine/i,/tecnologia/i,/tipologia.?servizio/i,/tipo.?linea/i,/tipo.?attiv/i,/operazione/i,/modello/i,/terminale/i,/dispositivo/i,/prodotto/i,/offerta/i,/tipo/i]],
 im:['Importo finanziato (TIMFin)',0,[/importo.?finanz/i,/finanziat/i,/importo/i,/valore/i,/prezzo/i]],
 cl:['Cliente (ragione sociale / P.IVA)',0,[/ragione.?sociale.?cli/i,/cliente/i,/partita.?iva/i,/p\.?\s?iva/i]]};
const toks=u=>(u.m||u.n||'').toLowerCase().split(/\s+/).filter(Boolean);
const mSell=val=>{val=(val||'').toLowerCase();if(!val)return'';for(const u of SELL()){const t=toks(u);if(t.length&&t.every(x=>val.includes(x)))return u.id}return''};
function guessType(fn,H){const f=(fn||'').toLowerCase(),h=H.join(' ').toLowerCase();if(/timfin|rate|finanz/.test(f))return'rt';if(/mob|sim|linee?_?mob/.test(f))return'mb';if(/fiss|nip|ull/.test(f))return'fx';
 for(const ty of PK){const m=S.cf.map[ty];if(m&&Object.values(m).filter(Boolean).every(c=>H.includes(c))&&Object.values(m).filter(Boolean).length>2)return ty}
 if(/timfin|finanz|rata|anticipo/.test(h))return'rt';if(/tipoorigine|\bull\b|\bnip\b|tecnologia/.test(h))return'fx';if(/msisdn|iccid|\bsim\b|mnp|portabilit/.test(h))return'mb';return''}

 for(const k in FLD){if(sv[k]&&H.includes(sv[k])){m[k]=sv[k];used.add(sv[k])}}

 if(!m.v){let best='',bn=0;H.forEach((h,i)=>{let n=0;for(const r of rows.slice(0,800))if(mSell(r[i]))n++;if(n>bn){bn=n;best=h}});if(!best)best=H.find(h=>/venditore|agente|commerciale|sales|account/i.test(h))||'';m.v=best}
 return m}
/* classificazione dello stato: A = attivo, L = in lavorazione, X = annullato */
function autoSt(s){s=(s||'').toLowerCase();if(/annull|scartat|\bko\b|respint|rifiut|revoc|recess|cessat|stornat|declin|bocciat/.test(s))return'X';if(/in attiv|da attiv|attesa|lavoraz|sospes|in corso|pending|in verifica|in istrutt|inserit|apert/.test(s))return'L';if(/attiv|espletat|complet|evas|erogat|liquidat|approvat|consegnat|chius|^ok|positiv/.test(s))return'A';return'L'}
const stC=(ty,s)=>S.cf.stm[ty][s]||autoSt(s);
async function load(fs){let m='';for(const f of fs){const buf=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}t=t.replace(/^﻿/,'');
 const r=csv(t);if(r.length<2){m+=`✖ ${esc(f.name)}: file vuoto o non leggibile (se dal portale arriva un errore di timeout riscaricalo)<br>`;continue}
 const H=r[0].map(h=>h.trim()),ty=guessType(f.name,H),mp=ty?guessMap(ty,H,r.slice(1)):{},ok=ty&&['k','d','s','st'].every(k=>mp[k])&&S.cf.map[ty];
 if(ok){const x=applyF(ty,H,r.slice(1),mp);m+=resMsg(f.name,ty,x)}else{V.pend={fn:f.name,ty,H,rows:r.slice(1),mp};m+=`➜ ${esc(f.name)}: controlla le colonne qui sotto e conferma<br>`;break}}
 V.msg=m;if(S.demo&&!V.pend)S.demo=0;dflt();R();if(S.cfg.rt&&!V.pend)sync(1)}
const resMsg=(fn,ty,x)=>`✔ ${esc(fn)} → ${PI[ty].l}: ${x.n} righe · ${x.nw} nuove, ${x.up} aggiornate, ${x.an} annullate in più${x.ns?', '+x.ns+' negozi nuovi':''}${x.nv?` · <b class="w">${x.nv} senza venditore riconosciuto</b>`:''} <a href="#" onclick="remap('${ty}');return false">rivedi colonne</a><br>`;

 for(const a of rows){const g=k=>I[k]>=0&&I[k]!=null?(a[I[k]]||'').trim():'';const s=g('s'),d=dt(g('d'));let k=g('k');if(!s||!d)continue;if(!k)k=s+'|'+d+'|'+a.join('|').length;

  if(!S.shops[s])ns++;const o0=S.shops[s]||{};S.shops[s]={n:g('n')||o0.n||s,c:g('c')||o0.c||'',p:(g('p')||o0.p||'').toUpperCase()};
  const st=g('st'),t=g('t'),o={k,s,d,v:v||'_',st,t,x:stC(ty,st)=='X'?1:0};if(ty=='fx')o.c=/ull/i.test(t)?'ULL':'NIP';if(ty=='rt')o.im=num(g('im'));const cl=g('cl');if(cl)o.cl=cl.slice(0,40);
  const old=db.get(k);if(!old)nw++;else if(old.st!=o.st){up++;if(!old.x&&o.x)an++}o.u=u;o.dc=old&&old.st==o.st?old.dc||old.d:(old?new Date().toISOString().slice(0,10):d);db.set(k,o);n++}
 S[ty]=[...db.values()];S.cf.map[ty]=mp;S.lu[ty]=Date.now();touch();return{n,nw,up,an,ns,nv}}
function remap(ty){V.pend={ty,H:[...new Set(Object.values(S.cf.map[ty]||{}).filter(Boolean))],rows:[],mp:S.cf.map[ty]||{},only:1};V.tab='data';R()}
